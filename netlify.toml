[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Proxy /api/ai-intelligence to Netlify serverless function
[[redirects]]
  from = "/api/ai-intelligence"
  to = "/.netlify/functions/ai-intelligence"
  status = 200

# Proxy any additional API routes to Netlify functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single Page Application (SPA) routing: fallback all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
